name: Prepare Zazo RAG dataset

on:
  schedule:
    # يوميًا 03:17 UTC (06:17 بتوقيت +03) لتجنب ذروة الدقيقة 00.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: zazo-rag-dataset-prep
  cancel-in-progress: false

jobs:
  prepare-dataset:
    name: Export and organize Neon RAG data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Request short-lived OIDC token and trigger private Worker export
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zazo-rag-data-prep")"
          oidc_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"
          unset oidc_response

          result="$(curl --fail-with-body --silent --show-error --max-time 900 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Accept: application/json' \
            'https://zazo-brain-backend.zazotona301.workers.dev/api/dataset/export')"
          unset oidc_token

          python3 -c '
          import json,sys
          result=json.load(sys.stdin)
          summary={key:result.get(key) for key in (
              "manifestKey", "latestManifestKey", "memoryRows", "chatPairs",
              "readyRows", "reviewRows", "duplicateRows", "skippedRows", "chunkCount"
          )}
          print("تم تجهيز بيانات RAG وحفظها في KV:")
          print(json.dumps(summary, ensure_ascii=False))
          ' <<< "$result"
          unset result
