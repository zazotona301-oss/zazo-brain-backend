name: Zazo Brain Backend checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Wrangler bundle without deploying
        run: npx wrangler deploy --dry-run

  sync-worker-secrets:
    name: Sync Worker secrets
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync required Worker API secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required to sync GitHub Secrets into the Worker." >&2
            exit 1
          fi
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN --name zazo-brain-backend
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --name zazo-brain-backend
          else
            echo "OPENAI_API_KEY is not configured in GitHub Secrets; skipping that optional Worker secret."
          fi

  deploy-worker:
    name: Deploy Worker
    needs: [check, sync-worker-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy zazo-brain-backend to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

  audio-smoke-test:
    name: Audio transcription smoke test
    if: github.event_name == 'workflow_dispatch'
    needs: [sync-worker-secrets, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Download public speech sample
        run: curl -L --fail --silent --show-error --max-time 60 https://raw.githubusercontent.com/openai/whisper/main/tests/jfk.flac -o sample.flac
      - name: Verify OpenAI transcription with the configured secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status=$(curl --silent --show-error --max-time 120 -w '%{http_code}' -o openai-result.json \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -F file=@sample.flac \
            -F model=whisper-1 \
            -F language=en \
            https://api.openai.com/v1/audio/transcriptions)
          echo "OpenAI transcription HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            python3 - <<'PY'
            import json
            result = json.load(open('openai-result.json'))
            print({'error': result.get('error', {}).get('type'), 'code': result.get('error', {}).get('code'), 'message': result.get('error', {}).get('message')})
            PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          result = json.load(open('openai-result.json'))
          assert result.get('text', '').strip(), 'OpenAI returned no transcript'
          print('OpenAI transcription returned text successfully')
          PY
      - name: Verify Worker transcription and Raqa filtering
        run: |
          curl --fail-with-body --silent --show-error --max-time 180 \
            -F file=@sample.flac \
            -F language=en \
            https://zazo-brain-backend.zazotona301.workers.dev/api/transcribe > worker-result.json
          python3 - <<'PY'
          import json
          result = json.load(open('worker-result.json'))
          assert result.get('transcriptionProvider') == 'openai-whisper'
          assert result.get('rawText', '').strip(), 'Worker returned no raw transcript'
          assert result.get('text', '').strip(), 'Worker returned no cleaned transcript'
          print({'filterProvider': result.get('filterProvider'), 'filterApplied': result.get('filterApplied')})
          PY
